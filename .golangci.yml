version: "2"

linters:
  enable:
    - revive
  exclusions:
    paths:
      - megalinter-reports/.*
  settings:
    revive:
      severity: "warning"
      confidence: 0.8

      rules:
        - name: blank-imports
          disabled: false
        - name: context-as-argument
          disabled: false
        - name: context-keys-type
          disabled: false
        - name: dot-imports
          disabled: false
        - name: error-return
          disabled: false
        - name: error-strings
          disabled: false
        - name: error-naming
          disabled: false
        - name: increment-decrement
          disabled: false
        - name: range
          disabled: false
        - name: receiver-naming
          disabled: false
        - name: superfluous-else
          disabled: false
        - name: time-naming
          disabled: false
        - name: unexported-return
          disabled: false
        - name: unreachable-code
          disabled: false
        - name: waitgroup-by-value
          disabled: false
        - name: exported
          disabled: false
        - name: package-comments
          disabled: false
        - name: var-naming
          disabled: false
        - name: redefines-builtin-id
          disabled: false
        - name: unused-parameter
          disabled: false
