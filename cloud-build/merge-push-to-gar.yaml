---
steps:
  - id: docker-build-eq-launcher
    name: gcr.io/cloud-builders/docker
    args:
      - buildx
      - build
      - "--platform=${_PLATFORM}"
      - "--push"
      - "-t"
      - "europe-west2-docker.pkg.dev/${_PROJECT_ID}/images/census31-eq-questionnaire-launcher:${SHORT_SHA}"
      - "-t"
      - "europe-west2-docker.pkg.dev/${_PROJECT_ID}/images/census31-eq-questionnaire-launcher:latest"
      - "."

  - id: create-and-deploy-launcher-release
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: gcloud
    args:
      - deploy
      - releases
      - create
      - "rel-${BUILD_ID}"
      - "--delivery-pipeline=${_DELIVERY_PIPELINE}"
      - "--region=${_REGION}"
      - "--source=."
      - "--images=launcher-image=europe-west2-docker.pkg.dev/${_PROJECT_ID}/images/census31-eq-questionnaire-launcher:${SHORT_SHA}"
      - "--to-target=${_TARGET}"
    wait_for:
      - docker-build-eq-launcher

substitutions:
  _PLATFORM: "linux/amd64"
  _REGION: "europe-west2"
  _DELIVERY_PIPELINE: "launcher-dev"
  _TARGET: "dev"

options:
  logging: CLOUD_LOGGING_ONLY
