---
steps:
  - name: gcr.io/cloud-builders/docker
    id: docker-build-eq-launcher
    args:
      - buildx
      - build
      - "--platform=${_PLATFORM}"
      - "--load"
      - "-t"
      - "launcher-pr:${SHORT_SHA}"
      - "."

  - name: gcr.io/cloud-builders/docker
    id: docker-tag
    args:
      - tag
      - "launcher-pr:${SHORT_SHA}"
      - "europe-west2-docker.pkg.dev/${_PROJECT_ID}/images/census31-eq-questionnaire-launcher/launcher:${SHORT_SHA}"
  
images:
  - "europe-west2-docker.pkg.dev/${_PROJECT_ID}/images/census31-eq-questionnaire-launcher/launcher:${SHORT_SHA}"

substitutions:
  _PLATFORM: "linux/amd64"

options:
  logging: CLOUD_LOGGING_ONLY
