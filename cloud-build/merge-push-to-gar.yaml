---
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - buildx
      - build
      - '--platform=${_PLATFORM}'
      - '--load'
      - '-t'
      - launcher-pr:$SHORT_SHA
      - .
    id: docker-build-eq-launcher

  # Push Docker image to GAR
  - name: gcr.io/cloud-builders/docker
    id: docker-push
    args:
      - push
      - "europe-west2-docker.pkg.dev/${_PROJECT_ID}/census31-eq-questionnaire-launcher/launcher:$SHORT_SHA"

images:
  - "europe-west2-docker.pkg.dev/${_PROJECT_ID}/census31-eq-questionnaire-launcher/launcher:$SHORT_SHA"

substitutions:
  _PLATFORM: linux/amd64

options:
  logging: CLOUD_LOGGING_ONLY