---
steps:
  - id: docker-build-eq-launcher-release
    name: gcr.io/cloud-builders/docker
    args:
      - buildx
      - build
      - "--platform=${_PLATFORM}"
      - "--load"
      - "-t"
      - "europe-west2-docker.pkg.dev/${_PROJECT_ID}/images/census31-eq-questionnaire-launcher:${TAG_NAME}"
      - "."

images:
  - "europe-west2-docker.pkg.dev/${_PROJECT_ID}/images/census31-eq-questionnaire-launcher:${TAG_NAME}"

substitutions:
  _PLATFORM: "linux/amd64"

options:
  logging: CLOUD_LOGGING_ONLY
